[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-study-assistant"
version = "1.0.0"
description = "Privacy-focused study assistant that turns lecture PDFs into study material using a local Ollama model."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Abdeljalil Sennaoui" }]
keywords = ["ollama", "streamlit", "study", "rag", "tf-idf", "local-llm"]
dependencies = [
    "streamlit>=1.49,<2.0",
    "requests>=2.31,<3.0",
    "pypdf>=4.2,<7.0",
    "scikit-learn>=1.4,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.5,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplifications
    "C4",   # comprehensions
    "RET",  # return statements
    "D",    # docstrings
]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
# Test names and small stub classes document themselves.
"tests/*" = ["D101", "D102", "D103", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"
